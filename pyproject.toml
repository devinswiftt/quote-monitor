[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-quote"
version = "0.1.0"
description = "港股实时异常成交监听与回放"
requires-python = ">=3.9"
dependencies = ["futu-api>=9.0"]

[project.scripts]
hk-quote = "hk_quote.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hk_quote = ["web/*.html", "web/*.js", "web/*.css"]
